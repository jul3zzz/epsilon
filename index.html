<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Epsilon — Entraînement ludique au brevet</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='rgb(108,123,255)'/><text x='50' y='73' font-size='62' font-family='Georgia,serif' font-weight='700' font-style='italic' fill='white' text-anchor='middle'>ε</text></svg>">
</head>
<body data-theme="theme-nuit" data-wallpaper="wp-aurore">

<div id="wallpaper" aria-hidden="true"></div>

<!-- ============ ÉCRAN DE CONNEXION ============ -->
<section id="auth" class="auth">
  <div class="auth-card">
    <div class="auth-logo epsilon-mark">ε</div>
    <h1 class="auth-title"><span>Epsilon</span></h1>
    <p class="auth-sub">Le calcul mental qui te prépare au brevet.</p>

    <div class="tabs" role="tablist">
      <button class="tab active" data-authtab="login" role="tab">Connexion</button>
      <button class="tab" data-authtab="signup" role="tab">Créer un compte</button>
    </div>

    <form id="form-login" class="auth-form" autocomplete="off">
      <label class="field">
        <span>Pseudo</span>
        <input type="text" id="login-user" maxlength="16" placeholder="ton pseudo" required>
      </label>
      <label class="field">
        <span>Mot de passe</span>
        <input type="password" id="login-pass" placeholder="••••••••" required>
      </label>
      <p class="form-msg" id="login-msg"></p>
      <button class="btn btn-primary btn-block" type="submit">Se connecter</button>
    </form>

    <form id="form-signup" class="auth-form hidden" autocomplete="off">
      <label class="field">
        <span>Pseudo <small>(3 à 16 caractères)</small></span>
        <input type="text" id="signup-user" maxlength="16" placeholder="ton pseudo" required>
      </label>
      <label class="field">
        <span>Mot de passe <small>(4 caractères minimum)</small></span>
        <input type="password" id="signup-pass" placeholder="••••••••" required>
      </label>
      <label class="field">
        <span>Confirme le mot de passe</span>
        <input type="password" id="signup-pass2" placeholder="••••••••" required>
      </label>
      <div class="avatar-pick" id="signup-avatars"></div>
      <p class="form-msg" id="signup-msg"></p>
      <button class="btn btn-primary btn-block" type="submit">Créer mon compte</button>
    </form>

    <p class="auth-note">🔒 Tout est enregistré uniquement sur cet ordinateur.</p>
    <div class="known-users" id="known-users"></div>
  </div>
</section>

<!-- ============ APPLICATION ============ -->
<div id="app" class="app hidden">

  <header class="topbar">
    <button class="brand" data-nav="accueil">
      <span class="brand-icon epsilon-mark">ε</span>
      <span class="brand-name"><b>Epsilon</b></span>
    </button>

    <div class="topbar-stats">
      <div class="chip chip-rank" id="chip-rank" data-nav="progression"></div>
      <div class="chip chip-coins" id="chip-coins"></div>
      <div class="chip chip-streak" id="chip-streak" title="Série de jours consécutifs"></div>
    </div>

    <button class="avatar-btn" id="topbar-avatar" data-nav="profil" title="Mon profil"></button>
    <button class="burger" id="burger" aria-label="Menu">☰</button>
  </header>

  <nav class="nav" id="nav">
    <button class="nav-item active" data-nav="accueil"><span>🏠</span>Accueil</button>
    <button class="nav-item" data-nav="lecons"><span>📖</span>Leçon</button>
    <button class="nav-item" data-nav="jouer"><span>🎮</span>Jouer</button>
    <button class="nav-item" data-nav="progression"><span>📈</span>Progression</button>
    <button class="nav-item" data-nav="boutique"><span>🛍️</span>Boutique</button>
    <button class="nav-item" data-nav="amis"><span>👥</span>Amis</button>
    <button class="nav-item" data-nav="profil"><span>👤</span>Profil</button>
    <button class="nav-item" data-nav="deconnexion"><span>🚪</span>Quitter</button>
  </nav>

  <main id="view" class="view"></main>

  <footer class="footer">
    <span>Epsilon — programme de 3<sup>e</sup> · hors ligne · données locales</span>
  </footer>
</div>

<div id="toasts" class="toasts"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>

<script src="assets/js/utils.js"></script>
<script src="assets/js/lessons.js"></script>
<script src="assets/js/questions.js"></script>
<script src="assets/js/questions-geo.js"></script>
<script src="assets/js/shop.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/progression.js"></script>
<script src="assets/js/games.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app.js"></script>
<script type="module" src="assets/js/amis.js"></script>
</body>
</html>
